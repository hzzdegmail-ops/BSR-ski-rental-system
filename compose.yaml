services:
  bsr:
    build: .
    restart: unless-stopped
    ports:
      - "${BSR_LISTEN_ADDRESS:-127.0.0.1}:${BSR_PORT:-8080}:8080"
    environment:
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-}"
      DEMO_PASSWORD: "${DEMO_PASSWORD:-BSR-demo-2026}"
    volumes:
      - bsr_data:/var/lib/bsr
    init: true
    stop_grace_period: 30s
volumes:
  bsr_data:
